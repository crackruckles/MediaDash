name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      # Do not let one OS silently mask a failure on the other. 00-B fixed the
      # local harness's false-pass problem; this fixes the CI-level equivalent.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python live-harness contracts (offline)
        run: python -B -m unittest discover -s tools/repair-test -p "test_*.py"
      - name: Format fixture contracts (offline)
        run: python -B tools/repair-test/run_formats.py --self-test
      - name: PowerShell harness syntax
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tools/check-harness-syntax.ps1
      - name: Shell harness syntax
        shell: bash
        run: |
          for file in tools/make-fixtures.sh tools/integration-test.sh tools/audit-migration/migrate.sh; do
            bash -n "$file"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard lifecycle and regression tests
        run: node --test tools/comprehensive-test/ui-lifecycle-self-tests.js tools/comprehensive-test/ui-regression-self-tests.js tools/comprehensive-test/ui-issue-fixes-self-tests.js
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Reported issue regressions and required acceptance evidence
        run: python -B tools/reported_issue_gate.py --output TestResults/${{ matrix.os }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-${{ matrix.os }}
          path: TestResults/${{ matrix.os }}/**/*.trx
          if-no-files-found: warn

  harness-self-tests:
    # Runs the PowerShell self-test scripts written in 00-B. They stub network,
    # browser, and file dependencies so no real Jellyfin is required. Runs on
    # both OSes because the harness truth-fixes (Get-RunVerdict, phase-id
    # validation, Assert-SafeLiveTarget) are portable.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Harness self-tests (comprehensive-test)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/comprehensive-test/self-tests.ps1
      - name: Scheduled task wait self-tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tools/comprehensive-test/task-wait-self-tests.ps1
      - name: Release source guard self-tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File tools/release-self-tests.ps1

  validator-self-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validator self-tests (repair-test)
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/repair-test/validator-self-tests.ps1
