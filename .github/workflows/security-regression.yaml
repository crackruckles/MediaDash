name: security-regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-security-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build Jellyfin.Plugin.MediaDash.sln --configuration Release
      - name: Security regression tests
        run: >-
          dotnet test Jellyfin.Plugin.MediaDash.sln
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~RecycleBinSafetyTests|FullyQualifiedName~PluginConfigurationPrivacyTests"
