overview: "The one plugin a Jellyfin library owner needs: finds duplicates, broken files, oversized encodes, unwanted or missing language tracks, misplaced files, corrupt artwork, orphaned metadata, and space-heavy trickplay — then fixes them safely."
description: >
  MediaDash keeps your Jellyfin library tidy, complete, and playable — covering
  movies, TV, music, audiobooks, books and comics on both Jellyfin 10.11 and 12.0
  from one binary. It finds duplicate copies, files that won't play, encodes above
  your quality ceiling, audio and subtitle tracks in unwanted languages, videos
  missing subtitles, misplaced files, ungrouped media, corrupt artwork,
  suspicious executables, orphaned metadata, stale content and space-heavy
  trickplay. Each fix type can run automatically or wait for your approval, with
  a built-in recycle bin so nothing is lost by accident. Dry-run mode ships on
  by default.
